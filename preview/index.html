    /* (The brand mark is a bitmap, scripts/icon-atlas.mjs, on its tile: the element's own background and rounded corners.) */
    .boot-mark, .brand-mark { display: block; background-image: var(--pps-mark); background-position: center; background-size: 100% 100%; background-repeat: no-repeat; border-radius: 23.4%; }
    #boot .boot-mark { width: 64px; height: 64px; background-color: #16181D; }
    #boot .boot-name { font: 600 var(--fs-20, 20px)/1.2 var(--font-display, Georgia, serif); letter-spacing: -.01em; color: var(--text, #16181D); opacity: 0; }
    #boot.named .boot-name { opacity: 1; animation: fade-rise var(--d-surface) var(--ease) both; }
    #boot.done .boot-in { --rise-y: -6px; animation: fade-rise-out var(--d-small) var(--ease-in) forwards; }
    /* In the dark reading room the mark's own dark tile would melt into the page; a hairline keeps its edge. */
    html[data-theme="dark"] #boot .boot-mark { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]):not([data-theme="soft"]) #boot .boot-mark { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); } }
    /* The wait bar shows only when loading runs past 1.2 s, in a plain ink (the mark carries the brand's gradient; the bar has none). */
    #boot .boot-bar { width: 140px; margin-top: 4px; height: 3px; border-radius: 3px; overflow: hidden; background: var(--hairline, rgba(0,0,0,.08)); opacity: 0; animation: boot-bar-in var(--d-small) var(--ease) 1.2s forwards; }
    #boot .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--text-3, #8a8a8a); animation: boot-slide 1.2s ease-in-out infinite; }
    /* The figure is held clear of the page until the cover lifts, then rises into it on the cover's own clock. (Opacity only: a scale would
       skew every getBoundingClientRect the figure's code reads while it runs.) */
    html[data-boot="hold"] #stageView { opacity: 0; }
    html[data-boot="rise"] #stageView { transition: opacity var(--d-surface) var(--ease); }
    #boot .boot-msg { max-width: min(520px, calc(100vw - 32px)); margin: auto 16px; padding: 22px 24px; border-radius: 14px; background: var(--surface, #fff); color: var(--text-1, #1a1a1a); box-shadow: 0 6px 30px rgba(0,0,0,.12); font: 400 15px/1.5 var(--font-ui, system-ui, -apple-system, "Segoe UI", Arial, sans-serif); text-align: left; }
    #boot .boot-msg h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    #boot .boot-msg p { margin: 0 0 10px; }
    #boot .boot-msg code { display: block; margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2, #f3f3f3); font: 12px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; color: var(--text-2, #555); }
