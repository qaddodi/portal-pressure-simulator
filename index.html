  <div class="app" id="app" data-mode="explore">
    <header class="topbar">
      <a class="brand" href="./" id="brandBtn" aria-label="Portal Pressure Simulator: home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><path d="M16 27.4V19.6c0-3.3-2.3-5.1-4.9-6.8L8.6 11.2M16 19.6c0-3.3 2.3-5.1 4.9-6.8l2.5-1.6" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="8.2" cy="9.6" r="2.9" fill="#7CC4E4"/><circle cx="23.8" cy="9.6" r="2.9" fill="#C0307A"/></svg>
        <span class="brand-text"><span class="brand-name">Portal Pressure</span><span class="brand-sub">Simulator</span></span>
      </a>
      <button class="scenario-btn" id="scenarioBtn" aria-haspopup="dialog" title="Choose a patient scenario">
        <span class="scenario-k" data-i18n="top.patient">Patient</span>
        <span class="scenario-v" id="scenarioName">Healthy</span>
        <svg class="chev"><use href="#i-chev-down"/></svg>
      </button>
      <div class="session-bar" id="sessionBar" role="status" hidden></div>
      <div class="top-right">
        <button class="pal-btn" id="btnPalette" title="Command palette (Ctrl K)" aria-label="Command palette"><svg><use href="#i-explore"/></svg><span class="pal-l" data-i18n="top.search">Search or run…</span><kbd>Ctrl K</kbd></button>
        <button class="ib" id="btnShare" title="Share &amp; export" aria-label="Share and export" data-i18n-attr="aria-label:top.share" aria-haspopup="menu"><svg><use href="#i-share"/></svg></button>
        <button class="ib" id="btnMenu" title="Settings, role, help" aria-label="Menu" data-i18n-attr="aria-label:top.menu" aria-haspopup="menu"><svg><use href="#i-sliders"/></svg></button>
        <button class="btn panel-toggle" id="btnInspector" aria-label="Show or hide the side panel (patient chart and instruments)" aria-pressed="true"><svg><use href="#i-panel"/></svg><span data-i18n="top.chart">Chart</span></button>
      </div>
    </header>

    <main class="stage-wrap" id="stageWrap" aria-label="Figure">
      <div class="stage-bar top" id="stageTop">
        <div class="sb-left">
          <div class="seg" id="viewSeg" role="group" aria-label="View">
            <button data-view="anatomic" aria-pressed="true" title="Anatomic view (A)" data-i18n="bar.anatomy">Anatomy</button>
            <button data-view="circuit" aria-pressed="false" title="Circuit view (A)" data-i18n="bar.circuit">Circuit</button>
          </div>
          <button class="chip-btn icon-only" id="btnDraw" aria-haspopup="menu" aria-label="Draw: paint fibrosis or clot on the anatomy" title="Draw: paint fibrosis or clot on the anatomy"><svg><use href="#i-fibrosis"/></svg></button>
        </div>
        <div class="sb-center stage-blocker" id="stageCenter"><span class="bleed-pill" id="bleedPill" role="status" hidden></span><div class="sb-banner" id="stageBanner"></div></div>
        <div class="sb-right">
          <div class="lens-btn" id="btnLayers" role="button" tabindex="0" aria-haspopup="dialog" title="Color the vessels by… (L cycles)"><span class="lens-name" id="colorModeLabel">Pressure</span><div class="legend" id="legend" role="img" aria-label="Color legend"></div><svg class="chev"><use href="#i-chev-down"/></svg></div>
          <button class="chip-btn" id="btnInstruments" aria-haspopup="dialog" title="Instruments: pressure profile, Doppler, HVPG, endoscopy… (I)"><svg><use href="#i-chart"/></svg><span data-i18n="bar.instruments">Instruments</span></button>
          <button class="chip-btn" id="btnFigure" title="Figure view: a clean, labeled plate to present or export (F)"><svg><use href="#i-camera"/></svg><span data-i18n="bar.figure">Figure</span></button>
        </div>
      </div>
      <div class="fig-head" id="figHead"></div>
      <div class="stage-view" id="stageView">
        <svg id="stage" role="application" aria-label="Portal circulation. Tab through vessels; arrow keys move along the flow."></svg>
        <canvas id="particles" aria-hidden="true"></canvas>
        <svg id="labels" aria-label="Pressure labels"></svg>
        <div id="overlay"></div>
        <div class="tool-card stage-blocker" id="toolHint" role="status" hidden></div>
        <div class="coach stage-blocker" id="coach" aria-live="polite"></div>
        <button class="ib stage-fit" id="zoomFit" aria-label="Fit the figure to the view" title="Fit (scroll or pinch to zoom, drag to pan)"><svg><use href="#i-fit"/></svg></button>
      </div>
      <div class="fig-foot" id="figFoot"></div>
      <div class="stage-bar bottom" id="stageBottom">
        <div class="timeline" id="timeline" role="group" aria-label="Timeline"></div>
      </div>
    </main>

    <section class="readouts" id="strip" aria-label="Clinical readouts"></section>

    <div class="panel-scrim" id="panelScrim" aria-hidden="true"></div>
    <aside class="panel" id="panel" aria-label="Side panel">
      <div class="panel-tabs" role="tablist" aria-label="Side panel">
        <button role="tab" id="tabChart" data-ptab="chart" aria-selected="true" aria-controls="panelChart"><svg><use href="#i-gauge"/></svg><span data-i18n="tabs.chart">Chart</span></button>
        <button role="tab" id="tabInstruments" data-ptab="instruments" aria-selected="false" aria-controls="dock"><svg><use href="#i-chart"/></svg><span data-i18n="tabs.instruments">Instruments</span></button>
        <button class="ib panel-close" id="panelClose" aria-label="Close the side panel" title="Close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="panel-page" id="panelChart" role="tabpanel" aria-labelledby="tabChart">
        <div id="panelLesson"></div>
        <div id="panelCase"></div>
        <div id="inspector"></div>
      </div>
      <section class="dock" id="dock" role="tabpanel" aria-labelledby="tabInstruments">
        <div class="dock-head" id="dockHead"></div>
        <div class="dock-body" id="dockBody"></div>
      </section>
    </aside>
  </div>

  <section class="home" id="home" aria-label="Home" hidden></section>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="why-pop" id="whyPop" role="dialog" aria-label="Why?"></div>
  <div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast-wrap" id="toasts"></div>
