      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol><symbol id="i-streaks" viewBox="0 0 24 24"><path d="M3 7.5c3-2 6 2 9 0s6-2 9 0M3 12.5c3-2 6 2 9 0s6-2 9 0M3 17.5c3-2 6 2 9 0s6-2 9 0"/></symbol><symbol id="i-chevrons" viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></symbol><symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12.2V4a1 1 0 0 1 1-1h8.2a1 1 0 0 1 .7.3l8 8a1 1 0 0 1 0 1.4l-8.2 8.2a1 1 0 0 1-1.4 0l-8-8a1 1 0 0 1-.3-.7z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="M2.5 12.2 12 17.2l9.5-5M2.5 16.4 12 21.4l9.5-5"/></symbol><symbol id="i-zones" viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M12 8 16 10.2v3.6L12 16l-4-2.2v-3.6z"/></symbol><symbol id="i-lymph" viewBox="0 0 24 24"><path d="M12 3c2.7 3.3 5 5.8 5 8.8a5 5 0 0 1-10 0C7 8.8 9.3 6.3 12 3z"/><path d="M4 20.5c2.700-1.400 5.300 1.400 8 0s5.300-1.400 8 0"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><path d="M6.5 18.5C13 18.5 9 5.5 17.5 5.5" stroke-dasharray="2.2 2.6"/><circle cx="4.5" cy="18.5" r="2.2"/><circle cx="19.5" cy="5.5" r="2.2"/></symbol>

  <div class="app" id="app" data-mode="explore">
    <header class="topbar float-ui stage-blocker" id="topbar" data-safe="top">
      <div class="float-pill tb-id">
        <button class="menu-btn" id="btnMenu" aria-haspopup="menu" aria-expanded="false" title="Menu: explore, lessons, cases, share, help">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7.5" class="brand-bg"/><path d="M3.2 11C3.2 6.9 7.4 4.6 13.8 4.6C20.2 4.6 25.9 5.2 29 6.6C29.6 6.9 29.4 7.7 28.8 8.1C26.2 9.9 22.8 11.9 20.2 13.9C18.4 15.3 16.8 16.9 15 17.8C14.2 18.2 13.5 17.6 12.8 17.9C11.6 18.5 11.2 19.4 9.6 19.6C7.4 19.9 5.2 18.8 4.2 16.8C3.5 15.3 3.2 13.3 3.2 11Z" fill="#F4E4E1"/><path d="M13.3 16.2C11.6 14.2 9.2 12.9 6.3 12.5M13.3 16.2C15.4 13.8 18.4 11.6 22 10" stroke="url(#pvGrad)" stroke-width="1.9" stroke-linecap="round" fill="none"/><path d="M17.4 29.3V23.4M28.6 22.3C24.8 23.4 20.8 23.6 17.4 23.4M17.4 23.4C15.8 21 14.6 19 13.3 16.2" stroke="url(#pvGrad)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="mb-t"><span class="mb-k">Menu</span><span class="mb-mode" id="modeName">Explore</span></span>
          <svg class="chev"><use href="#i-chev-down"/></svg>
        </button>
        <span class="tb-div" aria-hidden="true"></span>
        <button class="scenario-btn" id="scenarioBtn" aria-haspopup="dialog" title="Choose a patient scenario">
          <span class="scenario-k" data-i18n="top.patient">Patient</span>
          <span class="scenario-v" id="scenarioName">Healthy</span>
          <svg class="chev"><use href="#i-chev-down"/></svg>
        </button>
        <div class="session-bar" id="sessionBar" role="status" hidden></div>
      </div>
      <div class="stage-bar top" id="stageTop">
        <div class="sb-left">
          <div class="seg" id="viewSeg" role="group" aria-label="View">
            <button data-view="anatomic" aria-pressed="true" title="Anatomic view (A)" data-i18n="bar.anatomy">Anatomy</button>
            <button data-view="circuit" aria-pressed="false" title="Circuit view (A)" data-i18n="bar.circuit">Circuit</button>
            <button data-view="lobule" aria-pressed="false" title="Lobule: the liver's microcirculation" data-i18n="bar.lobule">Lobule</button>
          </div>
        </div>
        <div class="sb-right">
          <button class="chip-btn" id="btnLobuleLayers" aria-haspopup="menu" title="Layers: what to show on the lobule" hidden><svg><use href="#i-layers"/></svg><span>Layers</span><svg class="chev"><use href="#i-chev-down"/></svg></button>
          <button class="chip-btn" id="btnBlood" aria-haspopup="menu" title="Moving blood: streaks and chevrons"><svg><use href="#i-drop"/></svg><span>Blood</span><svg class="chev"><use href="#i-chev-down"/></svg></button>
          <div class="lens-btn" id="btnLayers" role="button" tabindex="0" aria-haspopup="dialog" title="Color the vessels by… (L cycles)"><span class="lens-name" id="colorModeLabel">Pressure</span><div class="legend" id="legend" role="img" aria-label="Color legend"></div><svg class="chev"><use href="#i-chev-down"/></svg></div>
        </div>
      </div>
      <div class="top-right float-pill">
        <button class="find-badge" id="btnInspector" aria-pressed="false" aria-haspopup="dialog" aria-controls="panel" title="Patient chart: what is abnormal and why"><svg><use href="#i-activity"/></svg><span class="fb-l">Findings</span><span class="fb-n" id="findBadge" data-sev="ok"><svg><use href="#i-check"/></svg></span></button>
        <button class="tb-act" id="btnTreat" aria-haspopup="dialog" aria-expanded="false" aria-controls="treatCard" title="Treat: drugs, fluids and procedures (T)"><svg><use href="#i-pill"/></svg><span>Treat</span></button>
        <button class="measure-launch tb-act" id="tabInstruments" aria-pressed="false" aria-controls="dock" title="Open instrument workspace (I)"><svg><use href="#i-gauge"/></svg><span data-i18n="tabs.instruments">Measure</span></button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button class="ib" id="btnSettings" aria-haspopup="dialog" aria-label="Settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
        <button class="pal-btn" id="btnPalette" title="Search (Ctrl K)" aria-label="Search" data-i18n-attr="aria-label:top.search"><svg><use href="#i-search"/></svg><span class="pal-l" data-i18n="top.search">Search</span><kbd>Ctrl K</kbd></button>
      </div>
    </header>

    <main class="stage-wrap" id="stageWrap" aria-label="Figure">
      <div class="stage-view" id="stageView">
        <svg id="stage" role="application" aria-label="Portal circulation. Tab through vessels; arrow keys move along the flow."></svg>
        <svg id="labels" aria-label="Pressure labels"></svg>
        <div id="overlay"></div>
        <div class="tool-card stage-blocker" id="toolHint" role="status" hidden></div>
        <div class="zoom-pill float-ui stage-blocker" id="zoomPill" role="group" aria-label="Zoom">
          <button class="ib" id="zoomIn" aria-label="Zoom in" title="Zoom in (or scroll / pinch)"><svg><use href="#i-plus"/></svg></button>
          <button class="ib" id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg><use href="#i-minus"/></svg></button>
          <button class="ib stage-fit" id="zoomFit" aria-label="Fit the figure to the view" title="Fit (drag to pan)"><svg><use href="#i-fit"/></svg></button>
          <button class="ib stage-rotate" id="rotateCircuit" aria-pressed="false" aria-label="Turn the circuit upright, flowing bottom to top" title="Turn the circuit upright (flow runs bottom to top)"><svg><use href="#i-rotate"/></svg></button>
        </div>
      </div>
      <div class="sb-center float-ui stage-blocker" id="stageCenter" data-safe="top"><div class="sb-banner" id="stageBanner"></div></div>
      <div class="coach float-ui stage-blocker" id="coach" aria-live="polite" data-safe="top"></div>
      <div class="vdock float-ui stage-blocker" id="vdock" data-safe="bottom">
        <div class="vd-status" id="vdStatus"><span class="bleed-pill" id="bleedPill" role="status" hidden></span></div>
        <div class="stage-bar bottom" id="stageBottom">
          <div class="timeline" id="timeline" role="group" aria-label="Timeline"></div>
        </div>
        <section class="readouts" id="strip" aria-label="Clinical readouts"></section>
      </div>
      <section class="dock instrument-workspace float-ui stage-blocker" id="dock" data-safe="bottom" aria-label="Live instrument workspace" data-state="open">
        <div class="dock-head" id="dockHead"></div>
        <div class="dock-body" id="dockBody"></div>
      </section>
    </main>

    <div class="panel-scrim" id="panelScrim" aria-hidden="true"></div>
    <aside class="panel float-ui stage-blocker" id="panel" aria-label="Findings" data-safe="right">
      <div class="lesson-rail" id="panelLesson" aria-label="Lesson"></div>
      <div class="panel-head card-head">
        <h2 class="card-title" id="panelTitle"><svg><use href="#i-activity"/></svg><span>Findings</span></h2>
        <button class="ib card-close" id="panelClose" aria-label="Close Findings" title="Close (Esc)"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="panel-page" id="panelChart" role="region" aria-labelledby="panelTitle">
        <div id="panelCase"></div>
        <div id="inspector"></div>
      </div>
    </aside>
    <section class="treat-card float-ui stage-blocker" id="treatCard" role="dialog" aria-label="Treat" data-safe="right" hidden></section>
  </div>

  <section class="home" id="home" aria-label="Home" hidden></section>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="why-pop" id="whyPop" role="dialog" aria-label="Why?"></div>
  <div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast-wrap" id="toasts"></div>
  <div class="sr-only" aria-live="polite" id="live"></div>
