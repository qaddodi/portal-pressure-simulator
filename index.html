<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portal Pressure Simulator</title>
  <meta name="description" content="An interactive, physics-based simulator of the portal circulation for medical education: collaterals, varices, flow reversal, HVPG, TIPS and more." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26 C 6 14 14 6 26 6' fill='none' stroke='%232D6CDF' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='4' fill='%23C0307A'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l12 8-5.5 1.2L9 18z"/><path d="M12 13l5 6"/></symbol>
      <symbol id="i-pinch" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18"/><path d="M12 3v4l-2-2M12 7l2-2M12 21v-4l-2 2M12 17l2 2"/></symbol>
      <symbol id="i-clot" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M8 8c2-2 6-2 8 0 2 2 1 6-2 7-3 1-5 0-6-2-1-1-1-3 0-5z"/><circle cx="11" cy="11" r="1"/><circle cx="14" cy="13" r="1"/></symbol>
      <symbol id="i-fibrosis" viewBox="0 0 24 24"><path d="M4 16c0-6 5-11 12-11 3 0 4 2 4 4 0 6-7 11-13 11-2 0-3-2-3-4z"/><circle cx="10" cy="12" r="1.5"/><circle cx="14" cy="9" r="1.2"/><circle cx="13" cy="14" r="1.2"/><circle cx="8" cy="15.5" r="1"/></symbol>
      <symbol id="i-stent" viewBox="0 0 24 24"><path d="M4 18L18 4"/><path d="M6 20L20 6"/><path d="M7 15l2 2M10 12l2 2M13 9l2 2M16 6l2 2"/></symbol>
      <symbol id="i-band" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="5" ry="7"/><path d="M6.5 10h11M6.5 14h11"/></symbol>
      <symbol id="i-occlude" viewBox="0 0 24 24"><path d="M3 12h7M14 12h7"/><circle cx="12" cy="12" r="3"/><path d="M12 4v4M12 16v4"/></symbol>
      <symbol id="i-balloon" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="13" rx="4"/><path d="M12 16v5"/></symbol>
      <symbol id="i-catheter" viewBox="0 0 24 24"><path d="M12 2v8c0 3 3 4 3 7v2"/><circle cx="15" cy="20" r="2"/></symbol>
      <symbol id="i-doppler" viewBox="0 0 24 24"><path d="M4 18h16"/><path d="M4 14c2-6 3-6 4 0s2 6 4 0 3-6 4 0 2 6 4 0"/></symbol>
      <symbol id="i-endoscope" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></symbol>
      <symbol id="i-needle" viewBox="0 0 24 24"><path d="M4 20l9-9"/><path d="M13 11l6-6 1 1-6 6"/><path d="M3 21l2-2"/></symbol>
      <symbol id="i-probe" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20 20"/><path d="M10 7v6M7 10h6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-settle" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7M12 17h.01"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M7 15l4-5 3 3 5-7"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14 7l3-3 3 3-3 3M17 4v0"/><path d="M4 20l9-9"/><path d="M4 4l6 6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-ff" viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app" data-sheet="controls">
    <header class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26 C 6 14 14 6 26 6" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="6" r="4" fill="#C0307A"/></svg>
        <span class="name hide-md">Portal Pressure Simulator</span>
      </div>
      <nav class="seg" role="tablist" aria-label="Mode" id="modeSeg">
        <button role="tab" data-mode="explore" aria-selected="true">Explore</button>
        <button role="tab" data-mode="learn" aria-selected="false">Learn</button>
        <button role="tab" data-mode="cases" aria-selected="false">Cases</button>
        <button role="tab" data-mode="compare" aria-selected="false" class="hide-sm">Compare</button>
      </nav>
      <div class="top-controls">
        <select class="select hide-sm" id="presetSelect" aria-label="Preset scenario"></select>
        <div class="divider-v hide-sm"></div>
        <div class="top-group">
          <button class="btn icon" id="btnPlay" title="Play / pause (Space)" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
          <select class="select hide-sm" id="speedSelect" aria-label="Speed" title="Simulation speed ([ and ])">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
          </select>
          <button class="btn icon hide-md" id="btnSettle" title="Settle to equilibrium (Z)" aria-label="Settle"><svg><use href="#i-settle"/></svg></button>
        </div>
        <div class="seg hide-sm" id="clockSeg" role="group" aria-label="Clock">
          <button data-clock="hemo" aria-pressed="true" title="Hemodynamic clock: seconds">Seconds</button>
          <button data-clock="disease" aria-pressed="false" title="Disease clock: days → months (remodeling)">Months</button>
        </div>
        <div class="top-group hide-sm" id="ffGroup" style="position:relative">
          <button class="btn" id="btnAdvance" title="Fast-forward the disease clock" aria-haspopup="menu"><svg><use href="#i-ff"/></svg><span class="hide-md">Advance</span> ▾</button>
          <div class="panel-float adv-menu" id="advMenu" role="menu" hidden>
            <button class="btn" data-ff="7" role="menuitem">+1 week</button>
            <button class="btn" data-ff="30" role="menuitem">+1 month</button>
            <button class="btn" data-ff="180" role="menuitem">+6 months</button>
            <button class="btn" data-ff="event" role="menuitem">Until next event</button>
          </div>
        </div>
        <span class="clock-readout hide-sm" id="clockReadout">t 0 s</span>
        <div class="divider-v hide-sm"></div>
        <div class="seg" id="viewSeg" role="group" aria-label="View">
          <button data-view="anatomic" aria-pressed="true" title="Anatomic view (A)">Anatomy</button>
          <button data-view="circuit" aria-pressed="false" title="Circuit view (A)">Circuit</button>
        </div>
        <div class="top-group hide-sm">
          <button class="btn icon" id="btnLayers" title="Layers & color mode" aria-label="Layers"><svg><use href="#i-layers"/></svg></button>
          <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
          <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
          <button class="btn icon" id="btnShare" title="Copy a link to this exact scenario" aria-label="Share"><svg><use href="#i-share"/></svg></button>
          <button class="btn icon" id="btnTheme" title="Toggle theme" aria-label="Toggle theme"><svg><use href="#i-theme"/></svg></button>
          <button class="btn icon" id="btnHelp" title="Help & shortcuts (?)" aria-label="Help"><svg><use href="#i-help"/></svg></button>
          <button class="btn icon hide-sm" id="btnInspector" title="Toggle inspector" aria-label="Toggle inspector"><svg><use href="#i-panel"/></svg></button>
        </div>
        <button class="btn icon" id="btnMore" title="More" aria-label="More" style="display:none"><svg><use href="#i-sliders"/></svg></button>
      </div>
    </header>

    <aside class="rail" id="toolRail" aria-label="Tools"></aside>

    <main class="stage-wrap" id="stageWrap" aria-label="Anatomical stage">
      <svg id="stage" role="application" aria-label="Portal circulation. Tab through vessels; arrow keys move along the flow."></svg>
      <canvas id="particles" aria-hidden="true"></canvas>
      <div id="overlay"></div>
      <div class="vignette" id="vignette"></div>
      <div class="hud hud-tl" id="hudTL"></div>
      <div class="hud hud-tr" id="hudTR"></div>
      <div class="hud hud-bl" id="hudBL"></div>
      <div class="hud hud-br" id="hudBR">
        <div class="zoom-ctl panel-float">
          <button class="btn icon" id="zoomIn" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
          <button class="btn icon" id="zoomOut" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
          <button class="btn icon" id="zoomFit" aria-label="Fit"><svg><use href="#i-fit"/></svg></button>
        </div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>

    <section class="dock" id="dock" aria-label="Readouts and charts">
      <div class="dock-resize" id="dockResize" title="Drag to resize"></div>
      <div class="strip" id="strip" role="list"></div>
      <div class="dock-tabs" role="tablist" id="dockTabs"></div>
      <div class="dock-body" id="dockBody"></div>
    </section>

    <div id="lessonDock"></div>

    <nav class="mobile-tabs" id="mobileTabs" role="tablist" aria-label="Panels">
      <button role="tab" data-sheet="controls" aria-selected="true"><svg><use href="#i-sliders"/></svg>Controls</button>
      <button role="tab" data-sheet="readouts" aria-selected="false"><svg><use href="#i-gauge"/></svg>Readouts</button>
      <button role="tab" data-sheet="charts" aria-selected="false"><svg><use href="#i-chart"/></svg>Charts</button>
      <button role="tab" data-sheet="tools" aria-selected="false"><svg><use href="#i-tools"/></svg>Tools</button>
      <button role="tab" data-sheet="lesson" aria-selected="false"><svg><use href="#i-book"/></svg>Lesson</button>
    </nav>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="why-pop" id="whyPop" role="dialog" aria-label="Why?"></div>
  <div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast-wrap" id="toasts"></div>
  <div class="sr-only" aria-live="polite" id="live"></div>

  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
