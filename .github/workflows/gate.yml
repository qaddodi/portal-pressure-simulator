name: Pre-push gate

# The gate (npm run gate, scripts/gate.mjs) in a headless browser, on request only (owner, 4 Nov 2026: no headless checks on every
# push): push a commit whose message contains [gate], or [gate-full] for the full sweep as well (every slide of every deck, desktop
# and phone, over six runners). It never blocks a deploy. Stages: static, boot, slides, views, pixels (see the header of scripts/gate.mjs).

on:
  push:
    branches: [claude/settings-topbar-icon-flvft1]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full sweep as well'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # (a push that does not ask for the gate never takes the place of one that does)
  group: gate-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gate]') || contains(github.event.head_commit.message, '[gate-full]') }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate (fast)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gate]') || contains(github.event.head_commit.message, '[gate-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Gate
        run: node scripts/gate.mjs --pixels --decks all --jobs 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-report
          path: test-results/gate/
          if-no-files-found: ignore
          retention-days: 3

  gate-full:
    name: gate full ${{ matrix.shard }}
    if: github.event.inputs.full == 'true' || contains(github.event.head_commit.message, '[gate-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Every slide, desktop and phone
        run: node scripts/gate.mjs --full --only slides --shard ${{ matrix.shard }} --jobs 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-full-report-${{ strategy.job-index }}
          path: test-results/gate/
          if-no-files-found: ignore
          retention-days: 3
