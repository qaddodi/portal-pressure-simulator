name: CI

# On pull requests and on main: lint, unit tests, the static checks and a strict build (BUILD_STRICT), then one smoke run of the
# production build (scripts/smoke-lite.mjs: boot, the views, every deck opens; no pixels, no timings). A newer push to the same pull
# request replaces a run still in progress. (The 84-shard browser suite, pixels and frame gates were retired on 4 Nov 2026.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit tests, in parallel shards (one job could not finish them in its time limit).
  tests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      lint: false
      static: false

  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        env:
          BUILD_STRICT: '1'   # (the size budget fails here; on the preview it only warns)
        run: npm run lint
      - name: 'Types (advisory: the allow-list in jsconfig.json, PR-11)'
        run: npm run typecheck
        continue-on-error: true
      - name: Static checks (conflict markers; the app and the worker bundle)
        run: npm run check:static
      - name: Production build
        env:
          BUILD_STRICT: '1'
        run: npm run build
      # Made once, here: the smoke job downloads it.
      - name: Keep the build for the browser checks
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: [quick, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Smoke (boot, views, every deck opens)
        run: npm run smoke:lite -- dist

  # Every slide's card fits (recs D4): no card scrolls, no line is cut, at the Mac and the iPhone width. GL draws are stubbed (layout and words only),
  # so no graphics card is needed. Split over nine jobs by deck (scripts/card-fit.mjs). Known cases: scripts/card-fit-allowance.json.
  card-fit:
    name: Cards fit ${{ matrix.shard }}/9
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Every card fits (share ${{ matrix.shard }} of 9)
        run: node scripts/card-fit.mjs --shard ${{ matrix.shard }}/9 --jobs 3 --device mac,mac-xl,iphone
