name: CI

# On pull requests and on main: lint, unit tests, the static checks and a strict build (BUILD_STRICT), then one smoke run of the
# production build (scripts/smoke-lite.mjs: boot, the views, every deck opens; no pixels, no timings). A newer push to the same pull
# request replaces a run still in progress. (The 84-shard browser suite, pixels and frame gates were retired on 4 Nov 2026.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore saved deck states
        uses: actions/cache@v5
        continue-on-error: true
        timeout-minutes: 1
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: node_modules/.cache/pps-deck-states
          key: deck-states-${{ hashFiles('src/engine/**', 'src/worker-core.js', 'src/worker.js', 'src/ui/decks/**') }}
          restore-keys: deck-states-
      - name: Lint
        env:
          BUILD_STRICT: '1'   # (the size budget fails here; on the preview it only warns)
        run: npm run lint
      - name: 'Types (advisory: the allow-list in jsconfig.json, PR-11)'
        run: npm run typecheck
        continue-on-error: true
      - name: Physiology acceptance tests and cache stamps
        run: npm test
      - name: Static checks (conflict markers; the app and the worker bundle)
        run: npm run check:static
      - name: Production build
        env:
          BUILD_STRICT: '1'
        run: npm run build
      # Made once, here: the smoke job downloads it.
      - name: Keep the build for the browser checks
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Smoke (boot, views, every deck opens)
        run: npm run smoke:lite -- dist
