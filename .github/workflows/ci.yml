name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The browser checks used to run one after another in a single job (source site, then build, then
# the visual check): about 40 minutes, and one timeout meant starting over. Now every share runs on
# its own runner at the same time, so the run takes as long as the slowest share.
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Physiology acceptance tests and cache stamps
        run: npm test
      - name: Production build
        run: npm run build

  # The build-free site (what Pages serves) and the production build (the SCORM package), each on
  # a desktop and a phone, desktop in two shares and phone in six: sixteen runners, one check at a time on each (a runner is
  # too small to run several browsers at once). A check that only timed out gets one more try.
  browser-checks:
    name: browser-checks (${{ matrix.site }}, ${{ matrix.device }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Desktop in two shares; phone in six, since it also walks every slide of all decks.
        include:
          - { site: source, device: desktop, shard: '1/2' }
          - { site: source, device: desktop, shard: '2/2' }
          - { site: source, device: phone, shard: '1/6' }
          - { site: source, device: phone, shard: '2/6' }
          - { site: source, device: phone, shard: '3/6' }
          - { site: source, device: phone, shard: '4/6' }
          - { site: source, device: phone, shard: '5/6' }
          - { site: source, device: phone, shard: '6/6' }
          - { site: build, device: desktop, shard: '1/2' }
          - { site: build, device: desktop, shard: '2/2' }
          - { site: build, device: phone, shard: '1/6' }
          - { site: build, device: phone, shard: '2/6' }
          - { site: build, device: phone, shard: '3/6' }
          - { site: build, device: phone, shard: '4/6' }
          - { site: build, device: phone, shard: '5/6' }
          - { site: build, device: phone, shard: '6/6' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      - name: Production build
        if: matrix.site == 'build'
        run: npm run build
      - name: Browser checks
        env:
          SHOTS: browser-shots
          SMOKE_DEVICE: ${{ matrix.device }}
          SMOKE_SHARD: ${{ matrix.shard }}
          SMOKE_WORKERS: 1
        run: npm run smoke -- ${{ matrix.site == 'build' && 'dist' || '.' }}
      # Needs a browser and the build: one of the build runners reports it.
      - name: Performance report
        if: matrix.site == 'build' && matrix.device == 'desktop' && matrix.shard == '1/2'
        run: npm run perf -- dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-checks-${{ matrix.site }}-${{ matrix.device }}-${{ strategy.job-index }}
          path: browser-shots/
          if-no-files-found: ignore

  # The presenter's words on an iPhone's engine (WebKit): they show once, at their final size.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: WebKit for Playwright
        run: timeout 300 npx playwright install --with-deps webkit
      - name: Presenter words keep one size (iPhone, WebKit)
        run: npm run smoke:webkit

  # The look (organ tones and light, vessels, lobule) against tests/visual, one device per runner;
  # on a failure the current pictures and diffs are kept as an artifact.
  visual:
    name: visual (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      - name: Visual regression
        env:
          VISUAL_DEVICE: ${{ matrix.device }}
        run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-${{ matrix.device }}
          path: test-results/visual
