name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Physiology acceptance tests and cache stamps
        run: npm test
      - name: Production build
        run: npm run build
      # Chromium comes from a cache keyed on the Playwright version; only the system packages
      # come from apt, with their own time limit so a slow mirror fails clearly.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: npx playwright install chromium
      # The runner image usually has every library Chromium needs already; apt (the slow,
      # mirror-dependent part) runs only when ldd reports one missing.
      - name: Install Chromium system packages
        timeout-minutes: 4
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) \
            -exec ldd {} + | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "All Chromium libraries present; skipping apt."
          fi
      - name: Smoke test (build-free site)
        run: npm run smoke
      - name: Smoke test (production build)
        run: npm run smoke:dist
      - name: Performance report
        run: npm run perf -- dist
