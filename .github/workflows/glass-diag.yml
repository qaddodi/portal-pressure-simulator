name: Glass diagnosis (macOS, Apple GPU)
on:
  push:
    branches: ['claude/glass-diag-preview']
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/gd && cd /tmp/gd && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install webkit chromium
      - run: cp .github/diag/glass-probe.mjs /tmp/gd/ && cd /tmp/gd && mkdir -p out && OUT=out node glass-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: glass-shots, path: /tmp/gd/out }
