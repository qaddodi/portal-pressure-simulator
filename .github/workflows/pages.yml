name: Pages (live site + preview)

# Publishes two copies of the build-free site to GitHub Pages:
#   /          the tip of main (the live site)
#   /preview/  the branch that triggered the run (a claude/** branch), or main again after a merge
# Every run rebuilds both from scratch, so the newest run always wins: the deploy job shares one
# concurrency group across branches. The browser checks are grouped per branch, so a push from
# another agent no longer cancels them part way through.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Quick checks gate the deploy (about a minute end to end), so a preview is never held up by
  # the browser tests.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and unit tests
        run: npm run lint && npm test

  # The browser checks run alongside the deploy, not before it: a failure marks the run red
  # (so it is seen) but the preview is already published for testing on devices.
  # Split over four runners (a device and half its checks each), one check at a time per runner:
  # a runner is too small to run several browsers at once.
  browser-checks:
    runs-on: ubuntu-latest
    concurrency:
      group: browser-checks-${{ github.ref }}-${{ matrix.device }}-${{ matrix.shard }}
      cancel-in-progress: true
    # Covers the install (capped at 4 minutes below) plus the checks (2 to 4 minutes).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium comes from a cache keyed on the Playwright version, so only the system packages
      # come from apt. A slow apt mirror then fails this step clearly instead of eating the job.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: npx playwright install chromium
      # The runner image usually has every library Chromium needs already; apt (the slow,
      # mirror-dependent part) runs only when ldd reports one missing.
      - name: Install Chromium system packages
        timeout-minutes: 4
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) \
            -exec ldd {} + | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "Missing libraries:"; echo "$missing"
            npx playwright install-deps chromium
          else
            echo "All Chromium libraries present; skipping apt."
          fi
      # Pages serves the repository root, so the browser checks run against it. The
      # production-build pass (npm run smoke:dist, for the SCORM package) stays in npm run check.
      - name: Browser checks
        env:
          SHOTS: workspace-shots
          SMOKE_DEVICE: ${{ matrix.device }}
          SMOKE_SHARD: ${{ matrix.shard }}
          SMOKE_WORKERS: 1
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-checks-${{ matrix.device }}-${{ strategy.job-index }}
          path: workspace-shots/
          if-no-files-found: ignore

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview

      - name: Assemble the site
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github --exclude node_modules live/ site/
          mkdir site/preview
          rsync -a --exclude .git --exclude .github --exclude node_modules preview/ site/preview/
          # Keep the preview out of search engines and record what it was built from.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex" />|' site/preview/index.html
          printf 'branch: %s\ncommit: %s\nbuilt:  %s\n' "$BRANCH" "$SHA" "$(date -u +%FT%TZ)" > site/preview/preview-info.txt
          # A branch preview wears a PREVIEW badge; after a merge /preview/ is just main, so no badge.
          if [ "$BRANCH" != "main" ]; then
            node preview/scripts/preview-badge.mjs site/preview "${SHA:0:7}"
          fi
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
