name: Pages (live site + preview)

# Publishes two copies of the build-free site to GitHub Pages:
#   /          the tip of main (the live site)
#   /preview/  the branch that triggered the run (a claude/** branch), or main again after a merge
# Every run rebuilds both from scratch, so the newest run always wins: the deploy job shares one
# concurrency group across branches. The browser checks are grouped per branch, so a push from
# another agent no longer cancels them part way through.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Quick checks gate the deploy (about a minute end to end), so a preview is never held up by
  # the browser tests.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and unit tests
        run: npm run lint && npm test

  # The browser checks run alongside the deploy, not before it: a failure marks the run red
  # (so it is seen) but the preview is already published for testing on devices.
  # Split over four runners (a device and half its checks each), one check at a time per runner:
  # a runner is too small to run several browsers at once.
  browser-checks:
    runs-on: ubuntu-latest
    concurrency:
      group: browser-checks-${{ github.ref }}-${{ matrix.device }}-${{ matrix.shard }}
      cancel-in-progress: true
    # Covers the install (capped at 4 minutes below) plus the checks (2 to 4 minutes).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      # Pages serves the repository root, so the browser checks run against it. The
      # production-build pass (npm run smoke:dist, for the SCORM package) stays in npm run check.
      - name: Browser checks
        env:
          SHOTS: workspace-shots
          SMOKE_DEVICE: ${{ matrix.device }}
          SMOKE_SHARD: ${{ matrix.shard }}
          SMOKE_WORKERS: 1
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-checks-${{ matrix.device }}-${{ strategy.job-index }}
          path: workspace-shots/
          if-no-files-found: ignore

  # Keeps tests/visual in step with the preview, so the references never pile up before a merge:
  # on the integration branch, views whose look changed get their references redrawn here, on CI's
  # own machines (the ones the merge check compares on), and committed back to the branch with the
  # list of views in the message. The owner reviews the look itself on the published preview.
  visual-refresh:
    if: github.ref_name == 'claude/settings-topbar-icon-flvft1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: visual-refresh-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-browser
      - name: Compare, and redraw the references of views that changed
        shell: bash
        run: npm run visual -- --refresh | tee visual.log
      - name: Commit refreshed references
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add tests/visual
          if git diff --cached --quiet; then echo "References already match."; exit 0; fi
          views=$(grep -o '^ref  [^ ]*' visual.log | cut -c6- | paste -sd, -)
          git -c user.name='github-actions[bot]' -c user.email='41898341+github-actions[bot]@users.noreply.github.com' \
            commit -m "Refresh visual references for ${SHA:0:7}: $views"
          # Other pushes may have landed meanwhile: replay on top of them (never a force-push).
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push the refreshed references; the next preview push redraws them."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-refresh
          path: tests/visual/
          if-no-files-found: ignore

  # Only main and the one integration branch publish. Other claude/** branches are still checked,
  # but their pushes no longer replace /preview/.
  deploy:
    needs: validate
    if: github.ref_name == 'main' || github.ref_name == 'claude/settings-topbar-icon-flvft1'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview

      - name: Assemble the site
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github --exclude node_modules live/ site/
          mkdir site/preview
          rsync -a --exclude .git --exclude .github --exclude node_modules preview/ site/preview/
          # Keep the preview out of search engines and record what it was built from.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex" />|' site/preview/index.html
          printf 'branch: %s\ncommit: %s\nbuilt:  %s\n' "$BRANCH" "$SHA" "$(date -u +%FT%TZ)" > site/preview/preview-info.txt
          # /preview/ always wears the PREVIEW badge so it is never mistaken for the live site; after a
          # merge it is main's build and the badge says so ("PREVIEW · main abc1234").
          LABEL="${SHA:0:7}"
          if [ "$BRANCH" = "main" ]; then LABEL="main $LABEL"; fi
          node preview/scripts/preview-badge.mjs site/preview "$LABEL"
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
