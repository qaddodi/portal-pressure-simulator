name: Pages (live site + preview)

# Publishes two production builds (npm run build) to GitHub Pages:
#   /          the last GATED main build (the live site): built from the commit the gate tested on main, and kept as published on gh-pages on a preview push (never rebuilt there)
#   /preview/  the preview branch's head. A push to it deploys that commit. A main run (slow: it waits for lint and the unit tests) deploys the branch's head too while the
#              branch has commits main does not, so a main deploy that lands after a newer branch deploy never puts an older build over it (Mohammad, 13 Nov 2026: "Keep preview
#              on the branch head"); once the branch is merged, /preview/ is main, badged "PREVIEW · main <commit>".
# On main the deploy waits for the GATE: the strict build (BUILD_STRICT: a chunk over the size limit, the first-load ceilings) and the smoke
# (scripts/smoke-lite.mjs on that build: boots, the three views, slide 1 of every deck) must both pass, so a build that does not start never goes live
# (PROD-1/PROD-2, 15 Nov 2026). Lint and unit tests (validate) still run and report, but a red result does not block the deploy (7 Nov, Mohammad).
# tests/deploy-gate.test.js fails if a deploy job can ever run on main without the gate's success.
# On the preview branch the deploy starts at once and an oversized chunk only warns; lint and unit tests run beside it in quick.yml (the gate is main's only).
# On the preview branch a new push cancels every older run of this workflow, waiting or running: only the newest commit deploys.
# On main nothing is cancelled. Browser checks are not part of the deploy.
# Every deploy also force-pushes the built site as ONE fresh commit (no history) to the gh-pages branch. While Settings > Pages > Source is "GitHub Actions" the
# upload-pages-artifact + deploy-pages steps below publish it; once the owner sets Source to "Deploy from a branch" (gh-pages, / (root)) they are skipped and Pages serves the branch.
# deploy-pages waits at most 10 min for Pages (a larger "timeout" is cut to 10 min). A slow Pages backend gets a second attempt (a new deployment) inside the 30 min job; a newer preview push still cancels it.

on:
  push:
    branches: [main, claude/settings-topbar-icon-flvft1]
  workflow_dispatch:

concurrency:
  group: pages-run-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: write   # (the deploy keeps the built site on the gh-pages branch as one fresh commit)
  pages: write
  id-token: write
  actions: write   # (the deploy deletes its site artifact once Pages has it)

jobs:
  # Gates main's deploy only.
  validate:
    if: github.ref_name == 'main'
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/unit-tests.yml   # (lint, then the unit tests in parallel shards: one job never finished in its time limit)
    with:
      lint: true
      static: false

  # Gates main's deploy: the strict build and the smoke on it, in one job (a failed build never reaches the smoke, and a smoke that does not pass
  # keeps main's build off the live site). About 10 to 15 minutes. It builds exactly what the deploy builds (the same commit, BUILD_STRICT).
  gate:
    if: github.ref_name == 'main'
    name: Gate (strict build, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: gate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-browser
      - name: Strict build
        env:
          BUILD_STRICT: '1'
        run: npm run build
      - name: Smoke (boot, views, every deck opens)
        run: npm run smoke:lite -- dist

  deploy:
    needs: [validate, gate]
    # On main the gate must have passed (success, nothing less); validate may be red (it reports, it does not gate).
    # On the preview branch both are skipped and the deploy goes at once. Any other ref deploys nothing.
    if: >-
      !cancelled() &&
      ((github.ref_name == 'main' && needs.gate.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'failure')) ||
       (github.ref_name == 'claude/settings-topbar-icon-flvft1' && needs.validate.result == 'skipped' && needs.gate.result == 'skipped'))
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    # GitHub Pages can sit in "queued" / "updating_pages" for many minutes on its side (5 Nov: 9+ min after a 25 s build; 6 Nov: 10+ min).
    # Two deploy-pages attempts of 10 min each, plus the build, must fit under the job's cap.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # What /preview/ is built from: the commit that triggered the run, except on main, where it is the preview branch's head if that has commits main does not.
      # If the API cannot say, main's own commit (the earlier behaviour).
      - name: Preview source
        id: pv
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PREVIEW_BRANCH: claude/settings-topbar-icon-flvft1
        run: |
          pv_branch="$BRANCH"; pv_sha="$SHA"
          if [ "$BRANCH" = 'main' ]; then
            ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${PREVIEW_BRANCH}" -q .ahead_by 2>/dev/null || echo 0)
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREVIEW_BRANCH}" -q .sha 2>/dev/null || echo '')
            if [ "${ahead:-0}" -gt 0 ] && [ -n "$head" ]; then pv_branch="$PREVIEW_BRANCH"; pv_sha="$head"; fi
          fi
          echo "branch=$pv_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$pv_sha" >> "$GITHUB_OUTPUT"
          echo "Preview built from $pv_branch @ $pv_sha"
      # The live site (/) is only ever a copy of a GATED build (SHL-1, 19 Nov 2026):
      #   - on main: the commit the gate tested (github.sha), never "main's tip at run time" (a commit that landed while the gate ran has not been gated yet);
      #   - on the preview branch: the `/` already published on gh-pages (the last gated main deploy). It is never rebuilt here, not even on a cache miss.
      # Full history (fetch-depth 0) so the build can name the newest release tag (PPS_RELEASE, SHL-3).
      - uses: actions/checkout@v5
        if: github.ref_name == 'main'
        with:
          ref: ${{ github.sha }}
          path: live
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pv.outputs.sha }}
          path: preview
          fetch-depth: 0
      - name: The live site as last published (preview pushes only)
        if: github.ref_name != 'main'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: kept

      # Main's release name, decided before the build so the site names the tag it will carry (v<year>.<month>.<n>, PR-04; SHL-3). The tag itself is made
      # after the deploy succeeded (the last step), so a refused build never gets one.
      - name: Name this release (main)
        id: rel
        if: github.ref_name == 'main'
        run: |
          cd live
          P="v$(date -u +%Y.%m)"
          N=$(git tag -l "$P.*" | sed "s/^$P\.//" | sort -n | tail -1)
          T="$P.$(( ${N:-0} + 1 ))"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "release=$T · $(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json

      # A copy whose build script has no "pages-build" marker is served as its source.
      - name: Build
        env:
          STRICT: ${{ steps.pv.outputs.branch == 'main' && '1' || '' }}
          LIVE_RELEASE: ${{ steps.rel.outputs.release }}
        run: |
          ready() { grep -q 'pages-build' "$1/scripts/build.mjs" 2>/dev/null; }
          build() { (cd "$1" && npm ci --no-audit --no-fund && npm run build); }
          # Main only: the live copy, strict (the gate built the same commit). A preview push never builds `live`.
          if [ "$GITHUB_REF_NAME" = 'main' ] && ready live; then PPS_RELEASE="$LIVE_RELEASE" BUILD_STRICT=1 build live; fi
          if ready preview; then BUILD_STRICT="$STRICT" build preview; fi

      # The source maps of main's build, one artifact per release (about 6 MB zipped, 30 days), so a field stack can be read back to a line (SHL-3).
      # They are not in the site (build.mjs moves them to dist-maps/).
      - name: Keep this release's source maps
        if: github.ref_name == 'main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maps-${{ steps.rel.outputs.tag }}
          path: live/dist-maps
          retention-days: 30

      - name: Assemble the site
        env:
          BRANCH: ${{ steps.pv.outputs.branch }}
          SHA: ${{ steps.pv.outputs.sha }}
        run: |
          copy() { if [ -f "$1/dist/index.html" ]; then rsync -a "$1/dist/" "$2/"; else rsync -a --exclude .git --exclude .github --exclude node_modules "$1/" "$2/"; fi; }
          mkdir site
          if [ "$GITHUB_REF_NAME" = 'main' ]; then
            copy live site
          else
            # Everything but the previous preview, as published: the live site is never rebuilt from an ungated commit.
            test -f kept/index.html || { echo "::error::gh-pages holds no live site to keep; run the main deploy first"; exit 1; }
            rsync -a --exclude .git --exclude preview kept/ site/
          fi
          mkdir site/preview
          copy preview site/preview
          # Keep the preview out of search engines and record what it was built from.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex" />|' site/preview/index.html
          printf 'branch: %s\ncommit: %s\nbuilt:  %s\n' "$BRANCH" "$SHA" "$(date -u +%FT%TZ)" > site/preview/preview-info.txt
          # /preview/ always wears the PREVIEW badge; after a merge it says "PREVIEW · main abc12345".
          LABEL="${SHA:0:8}"
          if [ "$BRANCH" = "main" ]; then LABEL="main $LABEL"; fi
          node preview/scripts/preview-badge.mjs site/preview "$LABEL"
          # One small page per case under c/, so shared links preview with the case title (scripts/share-pages.mjs).
          # (The public address goes in too, for the pictures' absolute URLs.)
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "$GITHUB_REF_NAME" = 'main' ] && [ -f live/scripts/share-pages.mjs ]; then node live/scripts/share-pages.mjs site "$SITE"; fi
          if [ -f preview/scripts/share-pages.mjs ]; then node preview/scripts/share-pages.mjs site/preview "$SITE/preview"; fi
          touch site/.nojekyll

      # The same site, as one orphan commit on gh-pages, replaced every time (a force push), so nothing piles up. It never fails the deploy.
      - name: Keep the site on the gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -q -m "Site built from ${SHA:0:8}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Which way Pages is served: "workflow" (the artifact steps below) or "legacy" (the gh-pages branch). If the API cannot say, keep the artifact way.
      - name: Pages source
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" -q .build_type 2>/dev/null || echo workflow)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.type != 'legacy'
        uses: actions/configure-pages@v6
      - if: steps.src.outputs.type != 'legacy'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # (v5 leaves dot files out by default; the site was published with them before)
          retention-days: 1
      # deploy-pages gives up after 10 min (its maximum) and cancels its deployment; a second attempt makes a new one, which often passes at once.
      - id: deployment
        if: steps.src.outputs.type != 'legacy'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
      - id: deployment-retry
        if: steps.src.outputs.type != 'legacy' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
      # The site artifact (~14 MB) is only needed until Pages has it.
      - name: Delete the site artifact
        if: always() && steps.src.outputs.type != 'legacy'
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: context.runId });
            for (const a of data.artifacts.filter((a) => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
            }
      # The release tag, after the deploy succeeded and only on main (SHL-1: tag-release.yml tagged every main push, gated or not, and is gone).
      - name: Tag this release
        if: github.ref_name == 'main' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          cd live
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "Tagged $TAG" >> "$GITHUB_STEP_SUMMARY"
