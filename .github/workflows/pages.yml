name: Pages (live site + preview)

# Publishes two production builds (npm run build) to GitHub Pages:
#   /          the tip of main (the live site)
#   /preview/  the commit that triggered the run (the preview branch, or main after a merge)
# On main, lint and unit tests (validate) still run and report, but a red result no longer blocks the deploy (7 Nov, Mohammad); the build is strict (BUILD_STRICT: a chunk over the size limit fails it).
# On the preview branch the deploy starts at once and an oversized chunk only warns; lint and unit tests run beside it in quick.yml.
# On the preview branch a new push cancels every older run of this workflow, waiting or running: only the newest commit deploys.
# On main nothing is cancelled. Browser checks are not part of the deploy.
# Every deploy also force-pushes the built site as ONE fresh commit (no history) to the gh-pages branch. While Settings > Pages > Source is "GitHub Actions" the
# upload-pages-artifact + deploy-pages steps below publish it; once the owner sets Source to "Deploy from a branch" (gh-pages, / (root)) they are skipped and Pages serves the branch.
# deploy-pages waits at most 10 min for Pages (a larger "timeout" is cut to 10 min). A slow Pages backend gets a second attempt (a new deployment) inside the 30 min job; a newer preview push still cancels it.

on:
  push:
    branches: [main, claude/settings-topbar-icon-flvft1]
  workflow_dispatch:

concurrency:
  group: pages-run-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: write   # (the deploy keeps the built site on the gh-pages branch as one fresh commit)
  pages: write
  id-token: write
  actions: write   # (the deploy deletes its site artifact once Pages has it)

jobs:
  # Gates main's deploy only.
  validate:
    if: github.ref_name == 'main'
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/unit-tests.yml   # (lint, then the unit tests in parallel shards: one job never finished in its time limit)
    with:
      lint: true
      static: false

  deploy:
    needs: validate
    # On main validate may be red (it reports, it does not gate); on the preview branch it is skipped and the deploy goes at once.
    if: >-
      !cancelled() &&
      ((github.ref_name == 'main' && (needs.validate.result == 'success' || needs.validate.result == 'failure')) ||
       (github.ref_name == 'claude/settings-topbar-icon-flvft1' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    # GitHub Pages can sit in "queued" / "updating_pages" for many minutes on its side (5 Nov: 9+ min after a 25 s build; 6 Nov: 10+ min).
    # Two deploy-pages attempts of 10 min each, plus the build, must fit under the job's cap.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: live
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: preview

      # Main's build is kept per main commit, so a preview deploy rebuilds only the preview.
      - name: Main's commit
        id: live
        run: echo "sha=$(git -C live rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Main's build from an earlier deploy
        id: live-dist
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: live/dist
          key: live-dist-${{ steps.live.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            live/package-lock.json
            preview/package-lock.json

      # A copy whose build script has no "pages-build" marker is served as its source.
      - name: Build
        env:
          LIVE_KEPT: ${{ steps.live-dist.outputs.cache-hit }}
          STRICT: ${{ github.ref_name == 'main' && '1' || '' }}
        run: |
          ready() { grep -q 'pages-build' "$1/scripts/build.mjs" 2>/dev/null; }
          build() { (cd "$1" && npm ci --no-audit --no-fund && npm run build); }
          if [ "$LIVE_KEPT" != 'true' ] && ready live; then build live; fi
          if ready preview; then BUILD_STRICT="$STRICT" build preview; fi

      - name: Assemble the site
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          copy() { if [ -f "$1/dist/index.html" ]; then rsync -a "$1/dist/" "$2/"; else rsync -a --exclude .git --exclude .github --exclude node_modules "$1/" "$2/"; fi; }
          mkdir site
          copy live site
          mkdir site/preview
          copy preview site/preview
          # Keep the preview out of search engines and record what it was built from.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex" />|' site/preview/index.html
          printf 'branch: %s\ncommit: %s\nbuilt:  %s\n' "$BRANCH" "$SHA" "$(date -u +%FT%TZ)" > site/preview/preview-info.txt
          # /preview/ always wears the PREVIEW badge; after a merge it says "PREVIEW · main abc12345".
          LABEL="${SHA:0:8}"
          if [ "$BRANCH" = "main" ]; then LABEL="main $LABEL"; fi
          node preview/scripts/preview-badge.mjs site/preview "$LABEL"
          # One small page per case under c/, so shared links preview with the case title (scripts/share-pages.mjs).
          if [ -f live/scripts/share-pages.mjs ]; then node live/scripts/share-pages.mjs site; fi
          if [ -f preview/scripts/share-pages.mjs ]; then node preview/scripts/share-pages.mjs site/preview; fi
          touch site/.nojekyll

      # The same site, as one orphan commit on gh-pages, replaced every time (a force push), so nothing piles up. It never fails the deploy.
      - name: Keep the site on the gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -q -m "Site built from ${SHA:0:8}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Which way Pages is served: "workflow" (the artifact steps below) or "legacy" (the gh-pages branch). If the API cannot say, keep the artifact way.
      - name: Pages source
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" -q .build_type 2>/dev/null || echo workflow)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.type != 'legacy'
        uses: actions/configure-pages@v6
      - if: steps.src.outputs.type != 'legacy'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # (v5 leaves dot files out by default; the site was published with them before)
          retention-days: 1
      # deploy-pages gives up after 10 min (its maximum) and cancels its deployment; a second attempt makes a new one, which often passes at once.
      - id: deployment
        if: steps.src.outputs.type != 'legacy'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
      - id: deployment-retry
        if: steps.src.outputs.type != 'legacy' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
      # The site artifact (~14 MB) is only needed until Pages has it.
      - name: Delete the site artifact
        if: always() && steps.src.outputs.type != 'legacy'
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: context.runId });
            for (const a of data.artifacts.filter((a) => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
            }
