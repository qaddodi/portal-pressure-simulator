name: Pages (live site + preview)

# Publishes two copies of the site to GitHub Pages, each as its production build (npm run build):
#   /          the tip of main (the live site)
#   /preview/  the branch that triggered the run (a claude/** branch), or main again after a merge
# Every run rebuilds both from scratch, so the newest run always wins: the deploy job shares one
# concurrency group across branches. Lint and unit run for every push and gate the deploy.
# On the integration branch a newer push cancels the older run's lint, browser, visual and WebKit
# checks at once, so the newest push gets the runners and deploys fast (owner's rule). A preview
# deploy that is already publishing is never cancelled (main included): the newest waiting one queues
# behind it and older waiting ones are dropped, so a burst of pushes always ends with the newest commit
# deployed. Every deploy rebuilds / from main's current tip, so a preview deploy never publishes a stale root.
# On main started checks run to the end.
# The deploy needs only lint and unit, and it goes first: the browser, visual and WebKit checks wait
# for the deploy job (they still run and report red afterwards). Before, the deploy job queued behind
# about forty check jobs for the account's runners and a push took 40 minutes to go live.
# Only main and the integration branch run this workflow. Thread branches (other claude/**) used to
# run lint and unit here too; those duplicate runs of the same commit took the account's runners while
# the preview push sat queued. They get everything in ci.yml on a pull request.
# The account runs about 20 jobs at once. An older run's ~40 check jobs used to take every slot, so a
# newer push's lint job could not start (and its checks, which wait for its deploy, could not cancel
# the old ones): pushes sat queued for 20-30 minutes. The browser shards now run at most 16 at a time
# (+2 visual +1 WebKit), so a slot stays free for a newer push's lint and deploy; once that deploys,
# its checks cancel the older run's checks through the concurrency groups below.
# On top of that the lint job's first step cancels the older runs of the same branch (unless one is
# publishing right now), so a new push never waits behind old checks.

on:
  push:
    branches: [main, claude/settings-topbar-icon-flvft1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  # Quick checks gate the deploy (about a minute end to end), so a preview is never held up by
  # the browser tests.
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # First thing, before any check can hold a runner: cancel the older runs of this branch whose
      # deploy is not publishing right now, so their ~40 queued or running check jobs free the
      # account's runners at once instead of only after this run's own deploy starts.
      - name: Cancel older runs of this branch
        if: ${{ github.ref_name != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/workflows/pages.yml/runs?branch=$GITHUB_REF_NAME&per_page=30" \
            --jq '.workflow_runs[] | select(.id < ($ENV.GITHUB_RUN_ID|tonumber) and (.status=="in_progress" or .status=="queued" or .status=="waiting")) | .id' |
          while read -r id; do
            publishing=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name=="deploy" and .status=="in_progress")] | length')
            if [ "$publishing" = "0" ]; then
              echo "Cancelling run $id"
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" || true
            else
              echo "Run $id is publishing, left alone"
            fi
          done || true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and unit tests
        run: npm run lint && npm test

  # The browser checks run alongside the deploy, not before it: a failure marks the run red
  # (so it is seen) but the preview is already published for testing on devices.
  # Split over thirty-six runners (desktop in twenty shares, phone in sixteen), filled by measured time, one check at a time per runner:
  # a runner is too small to run several browsers at once.
  browser-checks:
    needs: [validate, deploy]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.ref_name == 'main' || github.ref_name == 'claude/settings-topbar-icon-flvft1') }}
    runs-on: ubuntu-latest
    concurrency:
      group: browser-checks-${{ github.ref }}-${{ matrix.device }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    # Covers the install (capped at 4 minutes below) plus the checks (SMOKE_PLAN=1 npm run smoke prints each share's expected
    # minutes: 12 to 15 now, and a slow runner takes longer; at 15 minutes the shares were cut off mid-check and the run went red).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Leaves one of the account's ~20 runners free for a newer push (see the top of this file).
      max-parallel: 16
      matrix:
        # Desktop in twenty shares (the longest single checks take 11 to 15 minutes on a runner, so a share must not hold more than one plus a little); phone in sixteen, since it also walks every slide of all decks.
        include:
          - { device: desktop, shard: '1/20' }
          - { device: desktop, shard: '2/20' }
          - { device: desktop, shard: '3/20' }
          - { device: desktop, shard: '4/20' }
          - { device: desktop, shard: '5/20' }
          - { device: desktop, shard: '6/20' }
          - { device: desktop, shard: '7/20' }
          - { device: desktop, shard: '8/20' }
          - { device: desktop, shard: '9/20' }
          - { device: desktop, shard: '10/20' }
          - { device: desktop, shard: '11/20' }
          - { device: desktop, shard: '12/20' }
          - { device: desktop, shard: '13/20' }
          - { device: desktop, shard: '14/20' }
          - { device: desktop, shard: '15/20' }
          - { device: desktop, shard: '16/20' }
          - { device: desktop, shard: '17/20' }
          - { device: desktop, shard: '18/20' }
          - { device: desktop, shard: '19/20' }
          - { device: desktop, shard: '20/20' }
          - { device: phone, shard: '1/16' }
          - { device: phone, shard: '2/16' }
          - { device: phone, shard: '3/16' }
          - { device: phone, shard: '4/16' }
          - { device: phone, shard: '5/16' }
          - { device: phone, shard: '6/16' }
          - { device: phone, shard: '7/16' }
          - { device: phone, shard: '8/16' }
          - { device: phone, shard: '9/16' }
          - { device: phone, shard: '10/16' }
          - { device: phone, shard: '11/16' }
          - { device: phone, shard: '12/16' }
          - { device: phone, shard: '13/16' }
          - { device: phone, shard: '14/16' }
          - { device: phone, shard: '15/16' }
          - { device: phone, shard: '16/16' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      # Pages serves the repository root, so the browser checks run against it. The
      # production-build pass (npm run smoke:dist, for the SCORM package) stays in npm run check.
      - name: Browser checks
        env:
          SHOTS: workspace-shots
          SMOKE_DEVICE: ${{ matrix.device }}
          SMOKE_SHARD: ${{ matrix.shard }}
          SMOKE_WORKERS: 1
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-checks-${{ matrix.device }}-${{ strategy.job-index }}
          path: workspace-shots/
          if-no-files-found: ignore
          retention-days: 1

  # The presenter's words on an iPhone's engine (WebKit): they show once, at their final size.
  webkit:
    needs: [validate, deploy]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.ref_name == 'main' || github.ref_name == 'claude/settings-topbar-icon-flvft1') }}
    runs-on: ubuntu-latest
    concurrency:
      group: webkit-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: WebKit for Playwright
        run: timeout 300 npx playwright install --with-deps webkit
      - name: Presenter words keep one size (iPhone, WebKit)
        run: npm run smoke:webkit

  # The look against tests/visual on every preview push, so a drift shows up now, not at merge
  # time. A drift is a warning here (the diffs are kept as an artifact) and blocks only in ci.yml.
  # When the change to the look is intended, run the "Visual references" workflow on the branch,
  # which redraws the drifted views on these same machines and commits them.
  visual:
    name: visual (${{ matrix.device }})
    needs: [validate, deploy]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.ref_name == 'main' || github.ref_name == 'claude/settings-topbar-icon-flvft1') }}
    runs-on: ubuntu-latest
    concurrency:
      group: visual-${{ github.ref }}-${{ matrix.device }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      - name: Visual regression
        id: visual
        continue-on-error: true
        env:
          VISUAL_DEVICE: ${{ matrix.device }}
        shell: bash
        run: npm run visual | tee visual.log
      - name: Report drifted views
        if: steps.visual.outcome == 'failure'
        run: |
          views=$(grep -o '^FAIL [^:]*' visual.log | cut -c6- | paste -sd' ' -)
          echo "::warning title=Visual references drifted::$views. If intended, run the Visual references workflow on this branch; ci.yml blocks the merge until then."
      - uses: actions/upload-artifact@v4
        if: steps.visual.outcome == 'failure'
        with:
          name: visual-diff-${{ matrix.device }}
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 1

  # Only main and the one integration branch publish. Other claude/** branches are still checked,
  # but their pushes no longer replace /preview/.
  deploy:
    needs: validate
    if: github.ref_name == 'main' || github.ref_name == 'claude/settings-topbar-icon-flvft1'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      # Queue, never cancel: a deploy that is publishing finishes, and only the newest waiting one runs next.
      cancel-in-progress: false
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            live/package-lock.json
            preview/package-lock.json

      # Each copy is served as its production build (scripts/build.mjs: bundled, minified, hashed), which
      # loads far faster than ~60 source files on a slow or filtered network. A copy whose build script is
      # not ready for Pages yet (no "pages-build" marker, e.g. main before this change is merged) is
      # served as the source, as before.
      - name: Build
        run: |
          for d in live preview; do
            if grep -q 'pages-build' "$d/scripts/build.mjs" 2>/dev/null; then
              (cd "$d" && npm ci --no-audit --no-fund && npm run build)
            fi
          done

      - name: Assemble the site
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          copy() { if [ -f "$1/dist/index.html" ]; then rsync -a "$1/dist/" "$2/"; else rsync -a --exclude .git --exclude .github --exclude node_modules "$1/" "$2/"; fi; }
          mkdir site
          copy live site
          mkdir site/preview
          copy preview site/preview
          # Keep the preview out of search engines and record what it was built from.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex" />|' site/preview/index.html
          printf 'branch: %s\ncommit: %s\nbuilt:  %s\n' "$BRANCH" "$SHA" "$(date -u +%FT%TZ)" > site/preview/preview-info.txt
          # /preview/ always wears the PREVIEW badge so it is never mistaken for the live site; after a
          # merge it is main's build and the badge says so ("PREVIEW · main abc1234").
          LABEL="${SHA:0:7}"
          if [ "$BRANCH" = "main" ]; then LABEL="main $LABEL"; fi
          node preview/scripts/preview-badge.mjs site/preview "$LABEL"
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
      # The site artifact (~14 MB) is only needed until Pages has it; drop it so Actions storage stays near zero.
      - name: Delete the site artifact
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: context.runId });
            for (const a of data.artifacts.filter((a) => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
            }
