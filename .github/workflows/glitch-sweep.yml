name: Glitch sweep

# On request only: walks every slide of every presenter deck forward and back, and the Circuit / Anatomy / Lobule switches, a pinch and a pan,
# on a fake stepped clock (scripts/glitch-sweep.mjs), at Mac, iPhone and iPhone-sideways sizes, records the page at every step through each change
# and flags stuck cards, labels off their figure, flashes, numbers that change width, frozen opacity and a camera that does not come to rest.
# It never deploys and never blocks a merge. Run it from the Actions tab on main, or on a branch by pushing a commit whose message contains
# [glitch-sweep] (a dispatch works only for workflows on the default branch). Findings are in each job's log and the summary job.
on:
  workflow_dispatch:
  push:
    branches: ['claude/*']

permissions:
  contents: read
  actions: read

concurrency:
  group: glitch-sweep-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[glitch-sweep]') }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[glitch-sweep]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      decks: ${{ steps.decks.outputs.decks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List the decks
        id: decks
        run: |
          decks=$(node -e "import('./src/ui/decks.js').then((m) => { const ids = m.DECKS.map((d) => d.id); if (!ids.length) throw new Error('no decks'); console.log(JSON.stringify(ids)); })")
          echo "decks=$decks" >> "$GITHUB_OUTPUT"

  slides:
    name: ${{ matrix.deck }} (${{ matrix.size }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        deck: ${{ fromJSON(needs.plan.outputs.decks) }}
        size: [desktop, phone, sideways]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      - name: Walk the deck forward and back
        run: node scripts/glitch-sweep.mjs --decks ${{ matrix.deck }} --sizes ${{ matrix.size }} --jobs 1 --fps 20 --ms 1500 --out glitch-sweep --show 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-sweep-${{ matrix.deck }}-${{ matrix.size }}
          path: glitch-sweep/findings.json
          if-no-files-found: ignore
          retention-days: 3

  scenarios:
    name: views and gestures (${{ matrix.size }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        size: [desktop, phone, sideways]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser
      - name: View switches, pinch and pan
        run: node scripts/glitch-sweep.mjs --scenarios views,gestures --sizes ${{ matrix.size }} --jobs 1 --fps 20 --out glitch-sweep --show 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-sweep-scenarios-${{ matrix.size }}
          path: glitch-sweep/findings.json
          if-no-files-found: ignore
          retention-days: 3

  report:
    needs: [plan, slides, scenarios]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: glitch-sweep-*
          path: results
      - name: Summary
        run: node scripts/glitch-sweep-summary.mjs results | tee -a "$GITHUB_STEP_SUMMARY"
