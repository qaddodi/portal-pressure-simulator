name: On request (browser checks, gate, sweeps)

# Everything headless, on request only (owner, 4 Nov 2026: no headless or browser checks on every push). Nothing here deploys or blocks.
# Ask by a tag in the commit message, or from the Actions tab (the "what" input):
#   [checks]        the browser checks of the production build (browser.yml; a visual drift or a slow frame only warns, ci.yml blocks)
#   [gate]          the pre-push gate, scripts/gate.mjs (static, boot, slides, views, pixels)
#   [gate-full]     the gate plus every slide of every deck, desktop and phone, over six runners
#   [deck-sweep]    every slide of every deck at phone, iPad and desktop sizes (tests/e2e/deck-sweep.mjs), after this commit's deploy
#   [glitch-sweep]  every deck forward and back, the view switches, a pinch and a pan, on a fake clock (scripts/glitch-sweep.mjs)
# A push without a tag starts no job. A run that has started always finishes; a newer request replaces only the one waiting.

on:
  push:
    branches: [claude/settings-topbar-icon-flvft1]
  workflow_dispatch:
    inputs:
      what:
        description: 'What to run'
        type: choice
        options: [checks, gate, gate-full, deck-sweep, glitch-sweep]
        default: checks

permissions:
  contents: read
  actions: read   # (gh run list, so the deck sweep waits for the deploy)

concurrency:
  # (a push that asks for nothing never takes the place of one that does)
  group: on-request-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[checks]') || contains(github.event.head_commit.message, '[gate') || contains(github.event.head_commit.message, '-sweep]') }}
  cancel-in-progress: false

jobs:
  # The production build, made once: every browser job downloads it.
  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.what == 'checks') || contains(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: build
    uses: ./.github/workflows/browser.yml
    with:
      sites: '["build"]'
      strict: false

  gate:
    name: gate (fast)
    if: (github.event_name == 'workflow_dispatch' && startsWith(inputs.what, 'gate')) || contains(github.event.head_commit.message, '[gate]') || contains(github.event.head_commit.message, '[gate-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Gate
        run: node scripts/gate.mjs --pixels --decks all --jobs 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-report
          path: test-results/gate/
          if-no-files-found: ignore
          retention-days: 3

  gate-full:
    name: gate full ${{ matrix.shard }}
    if: (github.event_name == 'workflow_dispatch' && inputs.what == 'gate-full') || contains(github.event.head_commit.message, '[gate-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Every slide, desktop and phone
        run: node scripts/gate.mjs --full --only slides --shard ${{ matrix.shard }} --jobs 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-full-report-${{ strategy.job-index }}
          path: test-results/gate/
          if-no-files-found: ignore
          retention-days: 3

  # The deck list comes from the deck registry (src/ui/decks.js), so a new deck is never left out.
  sweep-plan:
    if: ((github.event_name == 'workflow_dispatch' && inputs.what == 'deck-sweep') || contains(github.event.head_commit.message, '[deck-sweep]')) || ((github.event_name == 'workflow_dispatch' && inputs.what == 'glitch-sweep') || contains(github.event.head_commit.message, '[glitch-sweep]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      decks: ${{ steps.decks.outputs.decks }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: List the decks
        id: decks
        run: |
          decks=$(node -e "import('./src/ui/decks.js').then((m) => { const ids = m.DECKS.map((d) => d.id); if (!ids.length) throw new Error('no decks'); console.log(JSON.stringify(ids)); })")
          echo "$decks"
          echo "decks=$decks" >> "$GITHUB_OUTPUT"
      # The deck sweep yields to the deploy: it starts once this commit's Pages run is done (or after about 27 minutes).
      - name: Wait for this commit's Pages run
        if: (github.event_name == 'workflow_dispatch' && inputs.what == 'deck-sweep') || contains(github.event.head_commit.message, '[deck-sweep]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 55); do
            left=$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml -c "$GITHUB_SHA" --json status -q '[.[] | select(.status != "completed")] | length')
            [ "$left" = "0" ] && exit 0
            sleep 30
          done
          echo "Pages run still going; sweeping anyway"

  deck:
    name: deck ${{ matrix.deck }} (${{ matrix.size }})
    needs: sweep-plan
    if: (github.event_name == 'workflow_dispatch' && inputs.what == 'deck-sweep') || contains(github.event.head_commit.message, '[deck-sweep]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        deck: ${{ fromJSON(needs.sweep-plan.outputs.decks) }}
        size: ['mac,desktop', 'laptop,wide', 'ipadwide,ipad', 'phone,phone375', 'phone430,sideways', 'sideways375,sideways430']   # (two sizes a job: a matrix holds at most 256 jobs)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Play the deck
        env:
          DECKS: ${{ matrix.deck }}
          DEVS: ${{ matrix.size }}
          FAST: '1'
        run: node tests/e2e/deck-sweep.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deck-sweep-${{ matrix.deck }}-${{ strategy.job-index }}
          path: deck-sweep/
          if-no-files-found: ignore
          retention-days: 1

  glitch-slides:
    name: glitch ${{ matrix.deck }} (${{ matrix.size }})
    needs: sweep-plan
    if: (github.event_name == 'workflow_dispatch' && inputs.what == 'glitch-sweep') || contains(github.event.head_commit.message, '[glitch-sweep]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        deck: ${{ fromJSON(needs.sweep-plan.outputs.decks) }}
        size: [desktop, phone, sideways]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Walk the deck forward and back
        run: node scripts/glitch-sweep.mjs --decks ${{ matrix.deck }} --sizes ${{ matrix.size }} --jobs 1 --fps 20 --ms 1500 --out glitch-sweep --show 200
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: glitch-sweep-${{ matrix.deck }}-${{ matrix.size }}
          path: glitch-sweep/findings.json
          if-no-files-found: ignore
          retention-days: 3

  glitch-scenarios:
    name: glitch views and gestures (${{ matrix.size }})
    needs: sweep-plan
    if: (github.event_name == 'workflow_dispatch' && inputs.what == 'glitch-sweep') || contains(github.event.head_commit.message, '[glitch-sweep]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        size: [desktop, phone, sideways]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: View switches, pinch and pan
        run: node scripts/glitch-sweep.mjs --scenarios views,gestures --sizes ${{ matrix.size }} --jobs 1 --fps 20 --out glitch-sweep --show 200
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: glitch-sweep-scenarios-${{ matrix.size }}
          path: glitch-sweep/findings.json
          if-no-files-found: ignore
          retention-days: 3

  sweep-report:
    needs: [sweep-plan, deck, glitch-slides, glitch-scenarios]
    if: always() && needs.sweep-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Deck sweep results
        if: needs.deck.result != 'skipped'
        uses: actions/download-artifact@v7
        with:
          pattern: deck-sweep-*
          path: results-deck
      - name: Deck sweep summary
        if: needs.deck.result != 'skipped'
        run: node scripts/deck-sweep-summary.mjs results-deck
      - name: Glitch sweep results
        if: always() && (needs.glitch-slides.result != 'skipped' || needs.glitch-scenarios.result != 'skipped')
        uses: actions/download-artifact@v7
        with:
          pattern: glitch-sweep-*
          path: results-glitch
      - name: Glitch sweep summary
        if: always() && (needs.glitch-slides.result != 'skipped' || needs.glitch-scenarios.result != 'skipped')
        run: node scripts/glitch-sweep-summary.mjs results-glitch | tee -a "$GITHUB_STEP_SUMMARY"
