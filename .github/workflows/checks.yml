name: Checks (browser, visual, WebKit)

# The browser checks on the preview branch, on request only (owner, 4 Nov 2026: no headless or browser checks on every push):
# run it from the Actions tab, or push a commit whose message contains [checks]. It checks the production build, never blocks
# the deploy, and a visual drift or a frame time past its ceiling only warns (ci.yml blocks on them). The jobs are in browser.yml.

on:
  push:
    branches: [claude/settings-topbar-icon-flvft1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (a push that does not ask for the checks never takes the place of one that does; a run that has started always finishes)
  group: checks-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[checks]') }}
  cancel-in-progress: false

jobs:
  # The production build, made once: every browser job downloads it.
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: build
    uses: ./.github/workflows/browser.yml
    with:
      sites: '["build"]'
      strict: false
