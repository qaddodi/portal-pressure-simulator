name: On request (smoke)

# The one browser check, on request only (owner, 4 Nov 2026: no headless runs on every push; recs in checks-redesign-recs.md).
# Ask from the Actions tab only (Run workflow). It never deploys or blocks, and a push starts no run of it.
#   scripts/smoke-lite.mjs on the production build: static, boot (desktop and phone), the three views, slide 1 of every deck,
#   on the GPU path (software WebGL: CI has no graphics card). It judges errors and that each change ends; no pixels, no timings.
#   scripts/card-fit.mjs: every slide of every deck at the Mac and iPhone width, GL draws stubbed: no card scrolls, no line is cut (also in ci.yml).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: on-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Production build
        run: npm run build
      - name: Smoke (boot, views, every deck opens)
        run: npm run smoke:lite -- dist

  card-fit:
    name: Cards fit ${{ matrix.shard }}/9
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Every card fits (share ${{ matrix.shard }} of 9)
        run: node scripts/card-fit.mjs --shard ${{ matrix.shard }}/9 --jobs 3 --device mac,mac-xl,iphone
